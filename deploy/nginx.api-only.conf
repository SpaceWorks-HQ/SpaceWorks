map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    location = /hooks/deploy {
        client_max_body_size 1m;
        proxy_pass http://deploy-webhook:8081;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location /api/v1/internal/ { return 403; }
    location /api/v1/live/ {
        proxy_pass http://live:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location ~ ^/(api|static|docs|redoc|schema)/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location / { return 404; }
}
