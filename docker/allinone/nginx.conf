# nginx for the single-box image: same routing as frontend/nginx.conf, but every upstream is
# a process in this container and nginx runs unprivileged (port 8080, writable paths under
# /var/lib/spaceworks/nginx). Keep the two files in step when a location changes.
pid /var/lib/spaceworks/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
daemon off;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /var/lib/spaceworks/nginx/body;
    proxy_temp_path /var/lib/spaceworks/nginx/proxy;
    fastcgi_temp_path /var/lib/spaceworks/nginx/fastcgi;
    uwsgi_temp_path /var/lib/spaceworks/nginx/uwsgi;
    scgi_temp_path /var/lib/spaceworks/nginx/scgi;
    sendfile on;
    client_max_body_size 110m;

    server {
        listen 8080;
        server_name _;
        root /srv/www;
        index index.html;

        location = /config.js {
            add_header Cache-Control "no-store";
            try_files /config.js =404;
        }

        location /api/v1/internal/ { return 403; }

        location ~ ^/api/v1/public/[^/]+/event-calendar/[^/]+\.ics$ {
            access_log off;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE: the dedicated gthread gunicorn on 8001, no buffering, no recycling.
        location /api/v1/live/ {
            proxy_pass http://127.0.0.1:8001/api/v1/live/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /control/ is deliberately NOT proxied: the Django control plane is reached only on
        # the backend port itself, exactly as in the multi-service image.

        location /static/ {
            proxy_pass http://127.0.0.1:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(docs|redoc|schema)/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
