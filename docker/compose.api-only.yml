# Park the website behind an inactive profile; expose only the API through nginx.
services:
  frontend:
    profiles: [website-disabled]
  api-edge:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.api-only.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      live:
        condition: service_started
