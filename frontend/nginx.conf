server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    location = /member-sw.js {
        add_header Cache-Control "no-cache";
        try_files /member-sw.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # Internal infra-only endpoints (e.g. the on-demand-TLS ask) must never be
    # reachable from the public web. Caddy also blocks this; deny here as
    # defense-in-depth. Longest-prefix match wins over the /api/ block below.
    location /api/v1/internal/ {
        return 403;
    }

    # A calendar subscription URL is a bearer credential over member activity.
    # Do not write its raw path into nginx access logs; Django independently redacts
    # Gunicorn's WSGI request-line value before the backend access log is emitted.
    location ~ ^/api/v1/public/[^/]+/(event-calendar|bookings/calendar)/[^/]+\.ics$ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events: a separate upstream (the `live` service) and no buffering, so
    # events reach the browser as they are published. Must sit above /api/ (longest prefix).
    location /api/v1/live/ {
        proxy_pass http://live:8000/api/v1/live/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Django control plane (/control/) is intentionally NOT exposed on this
    # public frontend port. It is reachable only via direct backend access.

    # Static assets for the admin + API docs (served by WhiteNoise on the backend).
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API documentation (drf-spectacular Swagger UI / Redoc / schema).
    location ~ ^/(docs|redoc|schema)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
