x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
x-restart: &default-restart unless-stopped
x-spaceworks-host-orchestration:
  scheduler:
    mode: image
    services: [beat]
  pointer:
    mode: atomic-file
    path: /var/lib/spaceworks/ops/database-pointer.env
    static_environment: .env
  database_identity: endpoint-plus-queried-uuid
  writer_services: [backend, live, worker, beat]
  sibling_lifecycle: bundled-owned-database
x-host-bootstrap: &host-bootstrap
  image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
  user: "0:0"
  entrypoint: ["python", "/app/scripts/bootstrap_host_orchestration.py"]
  environment: &host-bootstrap-env
    DATABASE_URL: postgres://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_manager}
    SPACEWORKS_RUNTIME_DATABASE_URL: ${DATABASE_URL:?use scripts/spaceworks-compose.sh}
    SPACEWORKS_HOST_MARKER_WRITE_PATH: /host-state/restore-marker.json
    SPACEWORKS_SCHEDULER_MODE: image
    SPACEWORKS_SCHEDULER_SERVICES: beat
  volumes:
    - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/host-state
services:
  # No database, Docker socket, .env or host marker: queue-only deployment receiver.
  deploy-webhook:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    entrypoint: ["python", "/app/scripts/deploy_webhook.py"]
    command: []
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      SPACEWORKS_REPOSITORY: ${SPACEWORKS_REPOSITORY:-SpaceWorks-HQ/SpaceWorks}
      SPACEWORKS_DEPLOY_WEBHOOK_SECRET: ${SPACEWORKS_DEPLOY_WEBHOOK_SECRET:-}
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/deploy-requests:/deploy-requests
      - ./backend/scripts/deploy_webhook.py:/app/scripts/deploy_webhook.py:ro
    expose: ["8081"]
    networks: [deploy-hooks]
  db:
    image: postgres:16
    restart: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makerspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-makerspace_manager}
    volumes:
      - makerspace_manager_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makerspace} -d ${POSTGRES_DB:-makerspace_manager}"], interval: 10s, timeout: 5s, retries: 6}
  minio:
    image: pgsty/silo:${SILO_IMAGE_TAG:-RELEASE.2026-09-16T00-00-00Z}
    restart: *default-restart
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${MINIO_API_BIND:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 10s, timeout: 5s, retries: 6}
  createbuckets:
    image: pgsty/silo:${SILO_IMAGE_TAG:-RELEASE.2026-09-16T00-00-00Z}
    depends_on: {minio: {condition: service_healthy}}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-evidence}
      PUBLIC_IMAGE_BUCKET: ${PUBLIC_IMAGE_BUCKET:-public-images}
    entrypoint: |
      /bin/sh -c '
      set -e;
      if [ "$$AWS_STORAGE_BUCKET_NAME" = "$$PUBLIC_IMAGE_BUCKET" ]; then
        echo "Private and public storage bucket names must be different." >&2;
        exit 1;
      fi;
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
      mc mb --ignore-existing "local/$$AWS_STORAGE_BUCKET_NAME";
      mc version enable "local/$$AWS_STORAGE_BUCKET_NAME";
      mc anonymous set none "local/$$AWS_STORAGE_BUCKET_NAME";
      mc mb --ignore-existing "local/$$PUBLIC_IMAGE_BUCKET";
      mc version enable "local/$$PUBLIC_IMAGE_BUCKET";
      mc anonymous set download "local/$$PUBLIC_IMAGE_BUCKET";
      '
  redis:
    image: redis:7-alpine
    restart: *default-restart
    logging: *default-logging
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 6}
  backend:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    environment: &backend-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
      DATABASE_URL: ${DATABASE_URL:?use scripts/spaceworks-compose.sh}
      SPACEWORKS_DB_POINTER_GENERATION: ${SPACEWORKS_DB_POINTER_GENERATION:?use scripts/spaceworks-compose.sh}
      MANAGED_POSTGRES: ${MANAGED_POSTGRES:-False}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
      DISABLE_SERVER_SIDE_CURSORS: ${DISABLE_SERVER_SIDE_CURSORS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-}
      PLATFORM_DOMAIN_SUFFIX: ${PLATFORM_DOMAIN_SUFFIX:-}
      PLATFORM_SUBDOMAIN_AUTO_TLS: ${PLATFORM_SUBDOMAIN_AUTO_TLS:-false}
      PLATFORM_ORIGIN_HOST: ${PLATFORM_ORIGIN_HOST:-}
      PLATFORM_STAFF_ORIGINS: ${PLATFORM_STAFF_ORIGINS:-}
      INFRA_HOSTS: ${INFRA_HOSTS:-localhost,127.0.0.1,backend}
      BEHIND_TRUSTED_PROXY: ${BEHIND_TRUSTED_PROXY:-false}
      API_CLIENT_ENC_KEY: ${API_CLIENT_ENC_KEY:-}
      AUDIT_MAC_MASTER_KEY: ${AUDIT_MAC_MASTER_KEY:-}
      AUDIT_ATTESTATION_DEPLOYMENT_ID: ${AUDIT_ATTESTATION_DEPLOYMENT_ID:-}
      AUDIT_ATTESTATION_ANCHOR_BACKEND: ${AUDIT_ATTESTATION_ANCHOR_BACKEND:-}
      AUDIT_ATTESTATION_S3_BUCKET: ${AUDIT_ATTESTATION_S3_BUCKET:-}
      AUDIT_ATTESTATION_S3_PREFIX: ${AUDIT_ATTESTATION_S3_PREFIX:-}
      AUDIT_ATTESTATION_RETENTION_DAYS: ${AUDIT_ATTESTATION_RETENTION_DAYS:-2555}
      AUDIT_ATTESTATION_S3_OBJECT_LOCK_MODE: ${AUDIT_ATTESTATION_S3_OBJECT_LOCK_MODE:-}
      AUDIT_ATTESTATION_S3_ENDPOINT_URL: ${AUDIT_ATTESTATION_S3_ENDPOINT_URL:-}
      AUDIT_ATTESTATION_S3_ACCESS_KEY_ID: ${AUDIT_ATTESTATION_S3_ACCESS_KEY_ID:-}
      AUDIT_ATTESTATION_S3_SECRET_ACCESS_KEY: ${AUDIT_ATTESTATION_S3_SECRET_ACCESS_KEY:-}
      AUDIT_ATTESTATION_S3_REGION_NAME: ${AUDIT_ATTESTATION_S3_REGION_NAME:-}
      AUDIT_ATTESTATION_HTTP_URL: ${AUDIT_ATTESTATION_HTTP_URL:-}
      AUDIT_ATTESTATION_HTTP_BEARER_TOKEN: ${AUDIT_ATTESTATION_HTTP_BEARER_TOKEN:-}
      AUDIT_ATTESTATION_HTTP_TIMEOUT: ${AUDIT_ATTESTATION_HTTP_TIMEOUT:-10}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-false}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Makerspace <noreply@example.com>}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:?set MINIO_ROOT_USER}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-evidence}
      PUBLIC_IMAGE_BUCKET: ${PUBLIC_IMAGE_BUCKET:-public-images}
      PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_PRESIGN_METHOD: ${STORAGE_PRESIGN_METHOD:-post}
      EVIDENCE_OBJECT_RETENTION_DAYS: ${EVIDENCE_OBJECT_RETENTION_DAYS:-365}
      EVIDENCE_OBJECT_EXPIRY_ENABLED: ${EVIDENCE_OBJECT_EXPIRY_ENABLED:-False}
      EVIDENCE_RETENTION_BATCH_SIZE: ${EVIDENCE_RETENTION_BATCH_SIZE:-100}
      EVIDENCE_ABANDONED_UPLOAD_CLEANUP_ENABLED: ${EVIDENCE_ABANDONED_UPLOAD_CLEANUP_ENABLED:-False}
      EVIDENCE_ABANDONED_UPLOAD_RETENTION_DAYS: ${EVIDENCE_ABANDONED_UPLOAD_RETENTION_DAYS:-7}
      CRON_SECRET: ${CRON_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ARCHIVE_SIGNING_PRIVATE_KEY: ${BACKUP_ARCHIVE_SIGNING_PRIVATE_KEY:-}
      BACKUP_ARCHIVE_VERIFY_PUBLIC_KEY: ${BACKUP_ARCHIVE_VERIFY_PUBLIC_KEY:-}
      BACKUP_OPS_DIR: /var/lib/spaceworks/ops/work
      SPACEWORKS_HOST_MARKER_PATH: /run/spaceworks-host/restore-marker.json
      BACKUP_PRODUCER_CAPABILITY_MARKER_PATH: /run/spaceworks-host/producer-capability.json
      BACKUP_PRODUCER_PRIVILEGED_SCRIPTS_DIR: /run/spaceworks-privileged-scripts
    command: ["--role", "backend", "sh", "-c", "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60} --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -"]
    healthcheck: {test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/readiness/', timeout=3).read()\""], interval: 10s, timeout: 5s, retries: 6, start_period: 45s}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, createbuckets: {condition: service_completed_successfully}, orchestration-ready: {condition: service_completed_successfully}}
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
      - ./scripts:/run/spaceworks-privileged-scripts:ro
  live:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    command: ["--role", "backend", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "-k", "gthread", "--threads", "${LIVE_THREADS:-32}", "--timeout", "0", "--access-logfile", "-", "--error-logfile", "-"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
    volumes:
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
  app:
    networks: [default, deploy-hooks]
    profiles: ["single"]
    image: ${MAKERSPACE_ALLINONE_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-allinone}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
      TENANT_API_URL: ${TENANT_API_URL:-/api}
      TENANT_TOKEN: ${TENANT_TOKEN:-}
    ports:
      - "${HTTP_PORT_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/v1/health/readiness/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    depends_on:
      deploy-webhook:
        condition: service_started
      db:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      orchestration-ready:
        condition: service_completed_successfully
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
      - ./scripts:/run/spaceworks-privileged-scripts:ro
      - allinone_state:/var/lib/spaceworks/redis
  orchestration-init:
    <<: *host-bootstrap
    depends_on: {db: {condition: service_healthy}}
  migrate:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_manager}
    command: ["--role", "migrate", "python", "manage.py", "migrate"]
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {orchestration-init: {condition: service_completed_successfully}}
  orchestration-ready:
    <<: *host-bootstrap
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    environment: *backend-env
    command: ["--role", "worker", "celery", "-A", "config", "worker", "-l", "info", "--concurrency", "${CELERY_CONCURRENCY:-4}"]
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
      - ./scripts:/run/spaceworks-privileged-scripts:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
  beat:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    environment: *backend-env
    command: ["--role", "beat", "celery", "-A", "config", "beat", "-l", "info", "--schedule", "/var/lib/celery/celerybeat-schedule"]
    volumes:
      - celerybeat_data:/var/lib/celery
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
  candidate-backend:
    profiles: [host-recovery]
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    environment: *backend-env
    command: ["--role", "backend", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck: {test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/readiness/', timeout=3).read()\""], interval: 10s, timeout: 5s, retries: 6}
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, createbuckets: {condition: service_completed_successfully}}
  frontend:
    networks: [default, deploy-hooks]
    image: ${MAKERSPACE_FRONTEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-frontend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    ports:
      - "${HTTP_PORT_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      deploy-webhook:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  makerspace_manager_pgdata:
  minio_data:
  celerybeat_data:
  allinone_state:
networks:
  default: {}
  deploy-hooks:
    internal: true
