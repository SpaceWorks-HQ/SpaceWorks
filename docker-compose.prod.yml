# Container logs are unbounded by default — a chatty worker will fill the host disk
# and take the database down with it. Every long-running service caps its json-file
# log below; one-shot services (migrate, createbuckets) are exempt by design.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Without this the stack does not come back after a host reboot or an OOM kill —
# the single most common way a self-hosted deployment silently goes down.
x-restart: &default-restart unless-stopped

services:
  db:
    image: postgres:16
    restart: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makerspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-makerspace_manager}
    volumes:
      - makerspace_manager_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makerspace} -d ${POSTGRES_DB:-makerspace_manager}"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    # Pinned, not :latest — an unpinned tag means the storage layer can change
    # under a running deployment on any `docker compose pull`, and it makes a
    # rollback impossible to reproduce.
    image: minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-09-07T16-13-09Z}
    restart: *default-restart
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Server-level CORS, comma-separated. This replaces the old per-bucket
      # `mc cors set` in createbuckets, which exits 1 on any current mc release
      # ("decoding xml: EOF" — mc now sends S3 XML, not the JSON that was written).
      # Because backend depends_on createbuckets completing successfully, that
      # failure left backend and frontend stuck in Created: setup.sh could never
      # bring the app up at all. Defaults to * only so an unset value cannot brick
      # uploads; setup.sh pins it to the real origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${MINIO_API_BIND:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  createbuckets:
    image: minio/mc:${MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-evidence}
      PUBLIC_IMAGE_BUCKET: ${PUBLIC_IMAGE_BUCKET:-public-images}
    # Buckets and their anonymous policies only. CORS moved to MINIO_API_CORS_ALLOW_ORIGIN
    # on the minio service (see above) — `mc cors set` is not usable here. `set -e` so a
    # genuine bucket failure still surfaces as a non-zero exit rather than a silent
    # half-provisioned storage layer.
    entrypoint: |
      /bin/sh -c '
      set -e;
      if [ "$$AWS_STORAGE_BUCKET_NAME" = "$$PUBLIC_IMAGE_BUCKET" ]; then
        echo "Private and public storage bucket names must be different." >&2;
        exit 1;
      fi;
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
      mc mb --ignore-existing "local/$$AWS_STORAGE_BUCKET_NAME";
      mc version enable "local/$$AWS_STORAGE_BUCKET_NAME";
      mc anonymous set none "local/$$AWS_STORAGE_BUCKET_NAME";
      mc mb --ignore-existing "local/$$PUBLIC_IMAGE_BUCKET";
      mc version enable "local/$$PUBLIC_IMAGE_BUCKET";
      mc anonymous set download "local/$$PUBLIC_IMAGE_BUCKET";
      '

  redis:
    image: redis:7-alpine
    restart: *default-restart
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    environment: &backend-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_manager}}
      MANAGED_POSTGRES: ${MANAGED_POSTGRES:-False}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-0}
      DISABLE_SERVER_SIDE_CURSORS: ${DISABLE_SERVER_SIDE_CURSORS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Absolute base for links in outbound email. Unset => links are emitted as bare
      # paths (e.g. "/reset-password?...") and password reset is unusable.
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-}
      API_CLIENT_ENC_KEY: ${API_CLIENT_ENC_KEY:-}
      AUDIT_MAC_MASTER_KEY: ${AUDIT_MAC_MASTER_KEY:-}
      AUDIT_ATTESTATION_DEPLOYMENT_ID: ${AUDIT_ATTESTATION_DEPLOYMENT_ID:-}
      AUDIT_ATTESTATION_ANCHOR_BACKEND: ${AUDIT_ATTESTATION_ANCHOR_BACKEND:-}
      AUDIT_ATTESTATION_S3_BUCKET: ${AUDIT_ATTESTATION_S3_BUCKET:-}
      AUDIT_ATTESTATION_S3_PREFIX: ${AUDIT_ATTESTATION_S3_PREFIX:-}
      AUDIT_ATTESTATION_RETENTION_DAYS: ${AUDIT_ATTESTATION_RETENTION_DAYS:-2555}
      AUDIT_ATTESTATION_S3_OBJECT_LOCK_MODE: ${AUDIT_ATTESTATION_S3_OBJECT_LOCK_MODE:-}
      AUDIT_ATTESTATION_S3_ENDPOINT_URL: ${AUDIT_ATTESTATION_S3_ENDPOINT_URL:-}
      AUDIT_ATTESTATION_S3_ACCESS_KEY_ID: ${AUDIT_ATTESTATION_S3_ACCESS_KEY_ID:-}
      AUDIT_ATTESTATION_S3_SECRET_ACCESS_KEY: ${AUDIT_ATTESTATION_S3_SECRET_ACCESS_KEY:-}
      AUDIT_ATTESTATION_S3_REGION_NAME: ${AUDIT_ATTESTATION_S3_REGION_NAME:-}
      AUDIT_ATTESTATION_HTTP_URL: ${AUDIT_ATTESTATION_HTTP_URL:-}
      AUDIT_ATTESTATION_HTTP_BEARER_TOKEN: ${AUDIT_ATTESTATION_HTTP_BEARER_TOKEN:-}
      AUDIT_ATTESTATION_HTTP_TIMEOUT: ${AUDIT_ATTESTATION_HTTP_TIMEOUT:-10}
      # Security hardening. Keep ENABLE_HTTPS=false for this HTTP-behind-nginx stack;
      # set it true only when a TLS proxy forwards X-Forwarded-Proto: https.
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-false}
      # The nginx frontend container is the one proxy in front of gunicorn, and it
      # appends the client to X-Forwarded-For. Unset, DRF keys throttles on REMOTE_ADDR,
      # which is nginx -- so every user shares one rate-limit bucket. Set this to 2 if a
      # TLS proxy (Caddy, Traefik, a cloud load balancer) is put in front of nginx.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Makerspace <noreply@example.com>}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-evidence}
      PUBLIC_IMAGE_BUCKET: ${PUBLIC_IMAGE_BUCKET:-public-images}
      PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_PRESIGN_METHOD: ${STORAGE_PRESIGN_METHOD:-post}
      CRON_SECRET: ${CRON_SECRET:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_OPS_DIR: /var/lib/spaceworks/ops
    # Gunicorn's defaults are one synchronous worker with a 30s hard timeout and no
    # request log — a single slow upload or Stripe call then blocks the entire site,
    # and nothing is recorded. Workers default to 3 (a sane 2-core box); raise
    # GUNICORN_WORKERS toward (2 x cores + 1) on bigger hosts.
    # Keep the whole gunicorn invocation on ONE line. In a YAML folded scalar (>) a
    # more-indented line keeps its newline instead of folding to a space, and a newline
    # inside `sh -c` ends the command — split the flags across lines and gunicorn runs
    # bare, silently falling back to its 127.0.0.1 default while each flag becomes a
    # failing command. The container healthcheck probes localhost, so it still reports
    # healthy while nginx gets connection-refused and every request 502s.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60} --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/readiness/', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      # collectstatic runs before gunicorn binds; without a grace period the first
      # few probes fail and depends_on: service_healthy can give up on a slow host.
      start_period: 45s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}:/var/lib/spaceworks/ops

  migrate:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    environment: *backend-env
    command: python manage.py migrate
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}:/var/lib/spaceworks/ops
    depends_on:
      db:
        condition: service_healthy
  worker:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    environment: *backend-env
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-4}
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}:/var/lib/spaceworks/ops
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    image: ${MAKERSPACE_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-backend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    environment: *backend-env
    # Explicit --schedule: beat otherwise writes its shelve into the CWD, which is
    # no longer writable now that the image drops to an unprivileged user. The named
    # volume preserves last-run timestamps so a restart doesn't re-fire every task.
    command: celery -A config beat -l info --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - celerybeat_data:/var/lib/celery
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}:/var/lib/spaceworks/ops
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${MAKERSPACE_FRONTEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-frontend}:${MAKERSPACE_IMAGE_TAG:-latest}
    restart: *default-restart
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  makerspace_manager_pgdata:
  minio_data:
  celerybeat_data:
