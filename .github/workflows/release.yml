name: Continuous Release
run-name: Release main@${{ github.sha }}

# Every commit that reaches main is a releasable build. VERSION selects the
# release series shown to users; the run number and commit SHA keep the current
# container image retry-safe, for example: 0.5.1-main.42.a1b2c3d4e5f6.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.release.outputs.base }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      series: ${{ steps.release.outputs.series }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      registry_owner: ${{ steps.release.outputs.registry_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release identifiers
        id: release
        shell: bash
        run: |
          set -euo pipefail

          base="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be a semantic version like 1.0.0 (got '$base')"
            exit 1
          fi

          series="${base%.*}"
          short_sha="${GITHUB_SHA:0:12}"
          registry_owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${base}-main.${GITHUB_RUN_NUMBER}.${short_sha}"

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "registry_owner=$registry_owner" >> "$GITHUB_OUTPUT"
          echo "Preparing $version"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: backend
            image: spaceworks-backend
          - context: frontend
            image: spaceworks-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Product name then version, e.g. "SpaceWorks 0.7.5". The immutable `tag_name`
          # above keeps its full `v<base>-main.<run>.<sha>` form -- the title is what a
          # human reads on the releases page, the tag is what a deployment pins to.
          name: SpaceWorks ${{ needs.prepare.outputs.base }}
          generate_release_notes: true
          make_latest: false
          body: |
            Continuous release from `main` at `${{ github.sha }}`.

            Docker images:

            - `ghcr.io/${{ needs.prepare.outputs.registry_owner }}/spaceworks-backend:${{ needs.prepare.outputs.version }}`
            - `ghcr.io/${{ needs.prepare.outputs.registry_owner }}/spaceworks-frontend:${{ needs.prepare.outputs.version }}`

  promote-latest:
    needs:
      - prepare
      - publish
      - github-release
    runs-on: ubuntu-latest
    concurrency:
      group: main-release-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this is still the main branch head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; leaving rolling tags unchanged."
          fi

      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote images to rolling tags
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          OWNER: ${{ needs.prepare.outputs.registry_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ needs.prepare.outputs.series }}
        run: |
          set -euo pipefail
          for package in spaceworks-backend spaceworks-frontend; do
            image="ghcr.io/${OWNER}/${package}"
            docker buildx imagetools create \
              --tag "${image}:${SERIES}" \
              --tag "${image}:main" \
              --tag "${image}:latest" \
              "${image}:${VERSION}"
          done

      - name: Mark this GitHub Release as latest
        if: steps.head.outputs.current == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          make_latest: true

      - name: Retain current and previous releases and container versions
        if: steps.head.outputs.current == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ needs.prepare.outputs.registry_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ needs.prepare.outputs.series }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" == 4 ]]; then
                return 1
              fi
              echo "GitHub API call failed (attempt ${attempt}/4); retrying." >&2
              sleep $((attempt * 2))
            done
          }

          if ! release_tags="$(retry gh release list --limit 1000 --json tagName --jq '.[].tagName')"; then
            echo "::warning::Could not list releases after retries; cleanup will run again on the next release."
            exit 0
          fi
          previous_release_tag=""
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$CURRENT_TAG" ]] && continue
            if [[ -z "$previous_release_tag" ]]; then
              previous_release_tag="$tag"
              continue
            fi
            if ! retry gh release delete "$tag" --yes; then
              echo "::warning::Could not remove release ${tag} after retries."
              continue
            fi
            if output="$(retry gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>&1)"; then
              echo "Removed Git tag ${tag}."
            elif [[ "$output" == *"HTTP 404"* || "$output" == *"HTTP 422"* ]]; then
              echo "Git tag ${tag} is already absent."
            else
              echo "::warning::Could not remove Git tag ${tag}: ${output}"
            fi
          done <<< "$release_tags"
          previous_version="${previous_release_tag#v}"

          python3 scripts/ghcr-retention.py \
            --owner "$OWNER" \
            --package spaceworks-backend \
            --package spaceworks-frontend \
            --version "$VERSION" \
            --sha-tag "sha-${SHORT_SHA}" \
            --series "$SERIES" \
            --previous-version "$previous_version"

          for package in osmm-backend osmm-frontend; do
            if output="$(retry gh api --method DELETE \
              "orgs/${OWNER}/packages/container/${package}" 2>&1)"; then
              echo "Removed legacy package ${package}."
            elif [[ "$output" == *"HTTP 404"* ]]; then
              echo "Legacy package ${package} is already absent."
            else
              echo "::warning::Could not remove legacy package ${package}: ${output}"
            fi
          done

      # Gated like every other step here: a superseded run must not fail because a
      # newer run's retention has already aged this version out.
      - name: Verify immutable release images are pullable
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          GHCR_OWNER: ${{ needs.prepare.outputs.registry_owner }}
        run: ./scripts/verify-release-images.sh "${{ needs.prepare.outputs.version }}"
